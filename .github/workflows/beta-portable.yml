name: Beta Portable Build

on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-portable:
    name: Build & Release Portable Beta
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Determine Version & Pre-release Tag
        id: versioning
        shell: pwsh
        run: |
          [xml]$xml = Get-Content CustomMcLauncher.csproj
          $ver = $xml.Project.PropertyGroup.Version
          if (-not $ver) { $ver = "1.0.0" }
          $tag = "v${ver}-beta.${{ github.run_number }}"
          echo "VERSION=$ver" >> $env:GITHUB_ENV
          echo "RELEASE_TAG=$tag" >> $env:GITHUB_ENV
          Write-Host "Prepared beta release tag: $tag"

      - name: Publish Self-Contained Portable Binary
        shell: pwsh
        run: |
          dotnet publish CustomMcLauncher.csproj -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -p:DebugType=none -p:DebugSymbols=false `
            -o ./publish

      - name: Package Portable Bundle
        shell: pwsh
        run: |
          # Clean debug symbols
          Remove-Item -Path ./publish/*.pdb -Force -ErrorAction SilentlyContinue

          # Provide default beta channel config next to portable executable
          Set-Content -Path ./publish/config.json -Value '{"channel": "beta"}'

          $zipName = "ZenithLauncher-${{ env.RELEASE_TAG }}-portable.zip"
          $exeName = "ZenithLauncher-${{ env.RELEASE_TAG }}-portable.exe"

          Compress-Archive -Path ./publish/* -DestinationPath "./$zipName" -Force
          Copy-Item -Path "./publish/Zenith Launcher.exe" -Destination "./$exeName" -Force

          echo "ASSET_ZIP=$zipName" >> $env:GITHUB_ENV
          echo "ASSET_EXE=$exeName" >> $env:GITHUB_ENV

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZenithLauncher-${{ env.RELEASE_TAG }}-portable
          path: |
            ${{ env.ASSET_ZIP }}
            ${{ env.ASSET_EXE }}

      - name: Publish GitHub Pre-Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          gh release create "${{ env.RELEASE_TAG }}" `
            "${{ env.ASSET_ZIP }}" `
            "${{ env.ASSET_EXE }}" `
            --title "Zenith Launcher ${{ env.RELEASE_TAG }}" `
            --prerelease `
            --notes "Automated pre-release beta portable build (commit ${{ github.sha }})."
